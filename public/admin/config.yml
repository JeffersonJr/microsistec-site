backend:
  name: github
  repo: JeffersonJr/microsistec-site
  branch: main # ou master, dependendo da sua branch principal

media_folder: "public/uploads" # Onde as imagens serão salvas no repositório
public_folder: "/uploads"      # Como o React acessará a URL da imagem

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog" # Onde os arquivos .md serão criados
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Data de Publicação", name: "date", widget: "datetime" }
      - { label: "Descrição/Resumo", name: "description", widget: "text" }
      - { label: "Imagem de Capa", name: "thumbnail", widget: "image", required: false }
      - { label: "Conteúdo", name: "body", widget: "markdown" }
