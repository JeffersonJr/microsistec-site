<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" fill="none">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Icon Grid + Arrow/House -->
  <g transform="translate(5, 5)">
    <!-- Stylized structural shape representing growth & real estate -->
    <path d="M20 2 L38 18 H29 V36 H11 V18 H2 L20 2 Z" fill="url(#emeraldGrad)" />
    <!-- Dynamic high performance arrow cutout inside -->
    <path d="M20 10 L28 17.5 H23 V26 H17 V17.5 H12 L20 10 Z" fill="#ffffff" />
    <!-- Small tech dot -->
    <circle cx="20" cy="30" r="2" fill="#ffffff" opacity="0.9" />
  </g>
  <!-- Brand Text -->
  <text x="55" y="31" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="800" font-size="22" fill="#111827" letter-spacing="-0.5">
    microsistec
  </text>
  <rect x="180" y="16" width="30" height="16" rx="4" fill="#10b981" opacity="0.15" />
  <text x="185" y="28" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="9" fill="#059669" letter-spacing="0.5">
    V8
  </text>
</svg>
